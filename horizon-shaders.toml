
schema = 1
id = "hshade"
name = "HShade 1.10"
version = "1.1.0"
api = "0.1"
description = "Atmospheric sky with enhanced gradients, clean water and soft lighting. Vibrant visuals."

[sky]
file = "sky.wgsl"
clouds = true
sun = true
stars = true

[material]
