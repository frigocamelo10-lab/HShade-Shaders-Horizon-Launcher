
schema = 1
id = "hshade3"
name = "HShade 1.3.0"
version = "1.3.0"
api = "0.1"
description = "Atmospheric sky, reflective water, mirror-like minerals and cinematic optical effects."

[sky]
file = "sky.wgsl"
clouds = true
sun = true
stars = true

[material]
file = "material.wgsl"

[shadow]
resolution = 512
distance = 128.0
option = "shadow_enabled"
distance_option = "shadow_distance"

[[post]]
file = "post/fog.wgsl"
name = "Atmospheric Fog"

[[post]]
file = "post/color.wgsl"
name = "Color Grading"

[[post]]
file = "post/blurmotion.wgsl"
name = "Motion Blur"

[[post]]
file = "post/bloom.wgsl"
name = "Bloom"

[[post]]
file = "post/nitidez.wgsl"
name = "Sharpen"

[[post]]
file = "post/ssao.wgsl"
name = "Ambient Occlusion"

[[post]]
file = "post/godrays.wgsl"
name = "Volumetric God Rays"

[[post]]
file = "post/sunflare.wgsl"
name = "Sun Lens"

