
schema = 1
id = "hshade"
name = "HShade 1.12"
version = "1.2.0"
api = "0.1"
description = "Atmospheric sky with enhanced gradients, clean water, soft lighting and optimized post-processing effects."

[sky]
file = "sky.wgsl"
clouds = true
sun = true
stars = true

[material]
file = "material.wgsl"

[[post]]
file = "post/fog.wgsl"
name = "Atmospheric Fog"

[[post]]
file = "post/color.wgsl"
name = "Color Grading"

[[post]]
file = "post/blurmotion.wgsl"
name = "Motion Blur"

[[post]]
file = "post/bloom.wgsl"
name = "Bloom"

[[post]]
file = "post/nitidez.wgsl"
name = "Sharpen"

[[options]]
id = "sky_strength"
name = "Sky Strength"
type = "float"
default = 1.0
min = 0.0
max = 2.0

[[options]]
